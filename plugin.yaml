name: homelab-watch
version: 0.1.0
manifest_version: 2
api_version: 1
description: >-
  Read-only monitoring for your homelab: router, servers, websites, a Bitaxe miner and your own cron
  jobs. Failures roll up to the root cause, so a router outage is one alert, not ten. Ask Hermes
  "is everything OK at home?" from chat or voice; alerts arrive through a no_agent cron job.
author: lpsmurf (HFSP Labs)
license: MIT
homepage: https://github.com/lpsmurf/hermes-homelab-watch
tags: [homelab, monitoring, uptime, bitaxe, home-assistant]
provides_tools:
  - homelab_status
  - homelab_heartbeat
provides_hooks:
  - post_api_request
config_schema:
  baseline_model:
    type: str
    default: ""
    label: Baseline model
    description: The model savings are measured against. Empty uses your main model.
  subscription_providers:
    type: list
    default: []
    label: Extra subscription providers
    description: Provider names you pay for with a flat plan (openai-codex and copilot are built in).
  prices:
    type: dict
    default: {}
    label: Extra prices
    description: 'USD per 1M tokens, e.g. {"my-model": {"input": 1, "output": 3}}. Unlisted models count as unpriced.'
  targets_file:
    type: str
    default: ""
    label: Targets file
    description: Path to targets.yaml. Empty uses the plugin's data folder (run `hermes homelab init`).
